<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Sellout Design · 数据字典</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root{
    --gray-bg:#F5F5F7; --white:#FFFFFF; --black:#1D1D1F; --sub:#6E6E73;
    --blue:#0066CC; --border:rgba(0,0,0,0.08); --card-dark:#1D1D1F;
    --c-navy:#1B2A4A; --c-teal:#2E6F95; --c-emerald:#2F7D6B; --c-gold:#D98E3B;
    --c-rose:#B5495B; --c-purple:#6B5B95; --c-slate:#5C6B7A; --c-sky:#4F8FC0;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif;background:var(--gray-bg);color:var(--black);}

  .nav{background:rgba(255,255,255,0.8); backdrop-filter:blur(20px) saturate(180%); border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:200; padding:0 40px; height:56px; display:flex; align-items:center; justify-content:space-between;}
  .nav-left{display:flex; align-items:center; gap:28px;}

  .oneloreal-logo{display:flex; align-items:center; gap:8px; line-height:1;}
  .oneloreal-logo .top-row{display:flex; flex-direction:column;}
  .oneloreal-logo .brand-line{font-size:9.5px; font-weight:800; letter-spacing:0.8px; color:var(--black); text-transform:uppercase;}
  .oneloreal-logo .data-row{display:flex; align-items:center; gap:3px; margin-top:1px;}
  .dot-d{
    display:grid; grid-template-columns:repeat(3, 3.5px); grid-template-rows:repeat(4, 3.5px); gap:1.6px;
    margin-right:2px;
  }
  .dot-d span{width:3.5px; height:3.5px; border-radius:50%; background:var(--black); opacity:0.85;}
  .dot-d span.off{opacity:0;}
  .data-text{font-size:19px; font-weight:800; letter-spacing:-0.5px; color:var(--black);}

  .nav-links{display:flex; gap:24px; font-size:12.5px;}
  .nav-links a{color:var(--sub); text-decoration:none; cursor:pointer; transition:color .15s;}
  .nav-links a:hover{color:var(--black);}
  .nav-status{display:flex; align-items:center; gap:14px; font-size:12px; color:var(--sub);}
  .dot{width:7px;height:7px;border-radius:50%;background:#C7C7CC;}
  .dot.on{background:#34C759; box-shadow:0 0 0 3px rgba(52,199,89,0.2);}
  .dot.err{background:#FF3B30; box-shadow:0 0 0 3px rgba(255,59,48,0.2);}

  .hero{max-width:1440px; margin:0 auto; padding:60px 40px 36px; display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:24px;}
  .hero h1{font-size:52px; font-weight:700; letter-spacing:-1.5px; margin:0; line-height:1.05;}
  .hero p.sub{color:var(--sub); font-size:16px; margin:10px 0 0;}
  .hero-links a{color:var(--blue); font-size:14px; text-decoration:none;}
  .hero-links a:hover{text-decoration:underline;}

  .container{max-width:1440px; margin:0 auto; padding:0 40px 80px;}
  .empty-state{text-align:center; padding:80px 20px; color:var(--sub);}
  .empty-state h2{color:var(--black); font-size:24px; margin-bottom:8px;}
  .diag{font-size:12px; color:var(--sub); margin-top:14px; background:#fff; border-radius:12px; padding:12px 16px; display:inline-block; border:1px solid var(--border);}

  .kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:20px;}
  .kpi-card{
    background:var(--white); border-radius:22px; padding:26px; border:1px solid var(--border);
    cursor:pointer; transition:all .2s ease; position:relative;
    display:flex; flex-direction:column;
  }
  .kpi-card:hover{transform:translateY(-3px); box-shadow:0 12px 28px rgba(0,0,0,0.1); border-color:transparent;}
  .kpi-card .label{
    font-size:12.5px; color:var(--sub); font-weight:500;
    display:flex; align-items:center; justify-content:space-between;
    line-height:1.2; height:16px; margin-bottom:16px;
  }
  .kpi-card .label .hint{font-size:11px; opacity:0; transition:opacity .2s; white-space:nowrap;}
  .kpi-card:hover .label .hint{opacity:0.6;}
  .kpi-card .value{font-size:38px; font-weight:700; letter-spacing:-1px; line-height:1; margin-bottom:10px;}
  .kpi-card .sub{font-size:12.5px; color:var(--sub); line-height:1.3; margin-top:0;}
  .kpi-card.active{background:var(--c-navy); color:#fff; border-color:transparent;}
  .kpi-card.active .label{color:rgba(255,255,255,0.65);}
  .kpi-card.active .sub{color:rgba(255,255,255,0.55);}

  .grid-2{display:grid; grid-template-columns:1.1fr 1fr; gap:16px; margin-bottom:16px;}
  .card{background:var(--white); border-radius:22px; padding:26px; border:1px solid var(--border); position:relative;}
  .card h3{margin:0 0 4px; font-size:19px; font-weight:600; letter-spacing:-0.3px;}
  .card .desc{font-size:13px; color:var(--sub); margin-bottom:16px;}
  .chart-wrap{position:relative; height:260px;}

  .filter-row{display:flex; flex-wrap:wrap; gap:12px; margin-bottom:18px;}
  .dropdown{position:relative;}
  .dropdown-btn{
    display:flex; align-items:center; gap:8px; padding:11px 16px; border-radius:12px;
    background:var(--gray-bg); border:1px solid var(--border); font-size:13.5px; font-weight:500;
    cursor:pointer; color:var(--black); min-width:150px; justify-content:space-between; transition:all .15s;
  }
  .dropdown-btn:hover{background:#EAEAEC;}
  .dropdown-btn.has-selection{background:var(--c-navy); color:#fff;}
  .dropdown-btn .arrow{font-size:10px; opacity:.6; transition:transform .2s;}
  .dropdown.open .dropdown-btn .arrow{transform:rotate(180deg);}
  .dropdown-panel{
    display:none; position:absolute; top:calc(100% + 8px); left:0; z-index:50;
    background:#fff; border:1px solid var(--border); border-radius:16px; box-shadow:0 12px 32px rgba(0,0,0,0.12);
    padding:12px; min-width:260px; max-height:340px; overflow-y:auto;
  }
  .dropdown.open .dropdown-panel{display:block;}
  .dropdown-panel-head{display:flex; align-items:center; justify-content:flex-end; padding:2px 4px 10px; border-bottom:1px solid var(--border); margin-bottom:8px;}
  .dropdown-panel-head .clear-one{font-size:11.5px; color:var(--sub); cursor:pointer;}
  .option-row{display:flex; align-items:center; gap:10px; padding:8px 6px; border-radius:8px; cursor:pointer; font-size:13.5px;}
  .option-row:hover{background:var(--gray-bg);}
  .option-row input{accent-color:var(--c-navy); width:15px; height:15px;}
  .option-row .cnt{margin-left:auto; font-size:11.5px; color:var(--sub);}
  .option-empty{font-size:12.5px; color:var(--sub); padding:12px 6px; text-align:center;}

  .search-bar{width:100%; padding:13px 18px; border-radius:14px; border:1px solid var(--border); background:var(--gray-bg); font-size:14px; margin:8px 0 16px; outline:none;}
  .search-bar:focus{border-color:var(--blue); box-shadow:0 0 0 3px rgba(0,102,204,0.12); background:#fff;}

  .result-summary{font-size:12.5px; color:var(--sub); margin-bottom:14px; display:flex; align-items:center; justify-content:space-between;}
  .clear-link{color:var(--blue); cursor:pointer; font-weight:500;}

  .dict-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:12px;}
  .dict-item{
    background:var(--white); border:1px solid var(--border); border-radius:16px; padding:16px;
    cursor:pointer; transition:all .2s ease;
  }
  .dict-item:hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,0.08); border-color:transparent;}
  .dict-title{font-size:13.5px; font-weight:600; line-height:1.3;}
  .dict-path{font-size:11px; color:var(--sub); margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .badges{display:flex; gap:5px; flex-wrap:wrap; margin-top:10px;}
  .badge{font-size:10.5px; padding:3px 9px; border-radius:980px; font-weight:600;}
  .badge.online{background:rgba(27,42,74,0.12); color:var(--c-navy);}
  .badge.offline{background:rgba(217,142,59,0.18); color:#A66B22;}
  .badge.div{background:rgba(92,107,122,0.14); color:var(--c-slate);}
  .badge.freq{background:rgba(47,125,107,0.16); color:var(--c-emerald);}
  .empty-note{text-align:center; color:var(--sub); padding:24px; font-size:13px; grid-column:1/-1;}

  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(29,29,31,0.5); backdrop-filter:blur(6px);
    z-index:500; align-items:center; justify-content:center; padding:24px;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{
    background:#fff; border-radius:24px; max-width:640px; width:100%; max
