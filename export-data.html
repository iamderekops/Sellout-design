
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>导出 data.json 工具（v2 智能表头识别）</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  body{font-family:-apple-system,"PingFang SC",sans-serif; background:#F5F5F7; color:#1D1D1F; margin:0; padding:30px;}
  .box{background:#fff; padding:32px; border-radius:20px; box-shadow:0 8px 30px rgba(0,0,0,0.08); max-width:900px; margin:0 auto;}
  h2{margin-top:0;}
  p{color:#6E6E73; font-size:13.5px; line-height:1.6;}
  label{font-size:13px; font-weight:600; display:block; margin:16px 0 6px;}
  input[type=number]{padding:8px 12px; border-radius:8px; border:1px solid #ddd; width:80px;}
  button{background:#0071E3; color:#fff; border:none; padding:10px 22px; border-radius:980px; font-size:13px; cursor:pointer; margin-top:16px;}
  button:hover{background:#0077ED;}
  button.secondary{background:#eee; color:#1D1D1F;}
  table{border-collapse:collapse; width:100%; font-size:12px; margin-top:16px;}
  th,td{border:1px solid #eee; padding:6px 8px; text-align:left; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  th{background:#F5F5F7; font-weight:600;}
  .status{font-size:13px; color:#0071E3; margin-top:14px; min-height:20px;}
  .warn{color:#FF9F0A; font-weight:600;}
  .ok{color:#34C759; font-weight:600;}
</style>
</head>
<body>
<div class="box">
  <h2>📤 导出 data.json（智能识别表头）</h2>
  <p>选择您更新后的 Excel 文件。工具会自动尝试识别真正的表头行（支持合并/多行表头），并在下方预览识别结果。<br>
     <b>请务必核对预览表格中"识别到的字段"是否对应正确</b>，确认无误后再点击"下载 data.json"。</p>

  <input type="file" id="fileInput" accept=".xlsx">

  <div id="controlsArea" style="display:none;">
    <label>表头结束于第几行（从1开始计数，往下才是正式数据）：</label>
    <input type="number" id="headerRowInput" min="1" value="1">
    <button class="secondary" id="reparseBtn">重新识别</button>
  </div>

  <div id="previewArea"></div>
  <div id="status"></div>
  <button id="downloadBtn" style="display:none;">⬇ 下载 data.json</button>
</div>

<script>
let sheetArray = []; // raw array-of-arrays
let finalRows = [];

const FIELD_KEYWORDS = {
  division_code: 'Division_Code',
  division_name: 'Division_Name',
  channel_l0: 'Channel L0',
  channel_l1: 'Channel L1',
  channel_l2: 'Channel L2',
  channel_l3: 'Channel L3',
  source: 'onedata_partition_source',
  remark: 'Remark',
  granularity: 'granularity',
  frequency: 'frequency',
  sellout_time: 'sellout time',
  nso_calc: 'NSO calculation',
  ingestion_logic: 'Ingestion Logic',
  processing_logic: 'processing Logic'
};

document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  sheetArray = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});

  // Auto-guess: find the row (within first 6) whose combined text contains "Division_Code"
  let guessRow = 1;
  for(let i=0; i<Math.min(6, sheetArray.length); i++){
    const rowText = sheetArray[i].join(' ').toLowerCase();
    if(rowText.includes('division_code')){ guessRow = i+1; break; }
  }
  document.getElementById('headerRowInput').value = guessRow;
  document.getElementById('controlsArea').style.display = 'block';
  parseAndPreview();
});

document.getElementById('reparseBtn').addEventListener('click', parseAndPreview);

function parseAndPreview(){
  const headerEndRow = parseInt(document.getElementById('headerRowInput').value || '1');
  const headerRows = sheetArray.slice(0, headerEndRow); // support multi-row header merge
  const dataRows = sheetArray.slice(headerEndRow);
  const numCols = Math.max(...sheetArray.map(r => r.length));

  // Build composite header text per column by joining all header rows' cell text
  const compositeHeaders = [];
  for(let c=0; c<numCols; c++){
    let parts = [];
    headerRows.forEach(r => { if(r[c] !== undefined && r[c] !== '') parts.push(String(r[c])); });
    compositeHeaders.push(parts.join(' '));
  }

  // Match each target field to a column index via keyword search
  const colMap = {};
  const unmatched = [];
  Object.entries(FIELD_KEYWORDS).forEach(([key, frag]) => {
    const idx = compositeHeaders.findIndex(h => h.toLowerCase().includes(frag.toLowerCase()));
    colMap[key] = idx;
    if(idx === -1) unmatched.push(key);
  });

  finalRows = dataRows
    .filter(r => r.some(cell => cell !== ''))
    .map(r => {
      const obj = {};
      Object.entries(colMap).forEach(([key, idx]) => { obj[key] = idx>=0 ? String(r[idx] ?? '') : ''; });
      return obj;
    });

  renderPreview(colMap, compositeHeaders, unmatched);
}

function renderPreview(colMap, compositeHeaders, unmatched){
  const area = document.getElementById('previewArea');
  let html = '<h3 style="font-size:14px;margin-top:24px;">识别到的字段映射</h3>';
  html += '<table><tr><th>字段</th><th>识别到的表头文本</th><th>示例值（第1条数据）</th></tr>';
  Object.entries(colMap).forEach(([key, idx]) => {
    const sample = finalRows[0] ? finalRows[0][key] : '';
    html += `<tr><td>${key}</td><td>${idx>=0? compositeHeaders[idx] : '<span class="warn">未识别到</span>'}</td><td>${(sample||'').toString().slice(0,60)}</td></tr>`;
  });
  html += '</table>';

  if(unmatched.length){
    html += `<p class="warn">⚠ 以下字段未能自动识别：${unmatched.join(', ')}。请尝试调整"表头结束于第几行"后点击"重新识别"。</p>`;
  } else {
    html += `<p class="ok">✅ 全部字段识别成功，共 ${finalRows.length} 条数据。请检查上表示例值是否正确对应，无误后下载。</p>`;
  }
  area.innerHTML = html;
  document.getElementById('downloadBtn').style.display = 'inline-block';
}

document.getElementById('downloadBtn').addEventListener('click', () => {
  const payload = { generatedAt: new Date().toLocaleString('zh-CN'), rows: finalRows };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'data.json'; a.click();
  document.getElementById('status').innerHTML = '<span class="ok">✅ 已生成 data.json，请到浏览器下载目录取用，上传替换GitHub仓库中的旧文件</span>';
});
</script>
</body>
</html>
